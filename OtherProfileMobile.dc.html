<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>arch; 다른 사람 프로필 · 모바일</title>
<meta name="viewport" content="width=390">
<script src="./shell.js?v=9"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./arch-api.js?v=9"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000;">
<dc-import name="ProfileMobile" other="{{yes}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  __archSub() { if (!this.__unsub && window.archApi) this.__unsub = archApi.onChange(() => this.forceUpdate()); }
  renderVals() {
    this.__archSub();
    return { yes: true };
  }
}
</script>
</body>
</html>
